# M1.4 B4 and Phase 3B-B: run the subscriptions API tests, the concurrency scenarios, the shared
# HTTP contract examples and the local HTTP harness tests (real HTTP -> real handler) against
# Amazon DynamoDB Local (a Docker container on the GitHub runner). No AWS account, no AWS
# credentials, no network access to AWS: fake keys and a localhost endpoint only.
# Manual only (Actions tab -> "M1.4 DynamoDB Local tests" -> Run workflow); never runs on push/PR.
name: M1.4 DynamoDB Local tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dynamodb-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports: ["8000:8000"]
    env:
      DDB_ENDPOINT: http://127.0.0.1:8000
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: ap-southeast-2
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r aws/requirements-test.lock
      - name: Wait for DynamoDB Local
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8000 && break; sleep 1; done
      - name: API tests + B4 scenarios + HTTP contract examples on DynamoDB Local
        run: python -m unittest -v aws/tests/test_m14_subscriptions_api.py aws/tests/test_m14_ddb_scenarios.py aws/tests/test_m14_http_contract.py
      - name: Local HTTP harness (Python) on DynamoDB Local
        run: python -m unittest -v aws/tests/test_m14_local_harness.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile  # the repository's lock file is bun.lock
      - name: HttpSubscriptionsClient over real HTTP (harness) on DynamoDB Local
        run: npm run test:harness
